<!doctype html><html lang="zh-Hant" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS 外送效能 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6b7280;--line:#e5e7eb;--nav:#14283d;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:white;padding:18px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:5px}.upload{display:flex;gap:8px;align-items:center}.btn,input,select{border:1px solid #cfd6df;border-radius:8px;background:#fff;padding:9px 11px;font-size:14px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:#fff;color:#14283d}.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 18px;overflow:auto}.tab{padding:14px 16px;border:0;background:transparent;cursor:pointer;font-weight:700;color:#64748b;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}main{max-width:1500px;margin:auto;padding:18px}.filters,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #00000008}.filters{padding:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(180px,1fr));margin-bottom:12px}.kpi{padding:15px}.kpi .label{font-size:13px;color:var(--muted);font-weight:700}.kpi .value{font-size:28px;font-weight:800;margin:8px 0}.kpi .detail{font-size:12px;color:var(--muted)}.bad{color:var(--red)}.good{color:var(--green)}.two{grid-template-columns:1fr 1fr}.section{padding:16px;margin-bottom:12px}.section h2{font-size:16px;margin:0 0 12px}.chartbox{height:320px}.tablewrap{overflow:auto;max-height:600px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;z-index:1;cursor:pointer}th:first-child,td:first-child{text-align:left}.pill{padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}.p-red{background:#fee2e2;color:#991b1b}.p-amber{background:#fef3c7;color:#92400e}.p-blue{background:#dbeafe;color:#1e40af}.p-green{background:#dcfce7;color:#166534}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.5}.search{min-width:250px}.opportunity{padding:12px;border-left:4px solid var(--amber);background:#fffbeb;border-radius:8px;margin:8px 0}.metric-row{display:flex;justify-content:space-between;gap:10px}.metric-row strong{font-size:18px}@media(max-width:900px){.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two{grid-template-columns:1fr}.chartbox{height:260px}}
</style></head><body>
<header><div><h1>DMS 外送效能 Dashboard <span style="font-size:14px;font-weight:600;opacity:.75">V22</span></h1><div class="sub">Excel 僅在此瀏覽器中分析，不會上傳顧客資料</div></div><div class="upload"><input id="orderFiles" type="file" accept=".xlsx,.xls" multiple style="display:none"><input id="riderFiles" type="file" accept=".xlsx,.xls" multiple style="display:none"><button class="btn primary" id="orderBtn">匯入訂單報表（可多選）</button><button class="btn primary" id="riderBtn">匯入 Rider Working（可多選）</button><button class="btn primary" id="exportStoreBtn">匯出目前餐廳</button><button class="btn primary" id="exportAllBtn">匯出全部餐廳</button></div><div id="importStatus" style="font-size:13px;color:#dbeafe;margin-top:8px">訂單：尚未匯入｜Rider Working：尚未匯入</div></header>
<nav class="tabs"><button class="tab active" data-page="overview">中心總覽</button><button class="tab" data-page="stores">餐廳效率</button><button class="tab" data-page="orders">訂單分析</button><button class="tab" data-page="riders">外送員效率</button><button class="tab" data-page="demand">訂單分布</button><button class="tab" data-page="staffing">人力＆排班</button><button class="tab" data-page="weekday">星期分析</button><button class="tab" data-page="mealmerge">餐期＆併單</button><button class="tab" data-page="capacity">運能決策</button><button class="tab" data-page="latefood">餐廳晚給餐</button><button class="tab" data-page="d25">D25 遲到分析</button><button class="tab" data-page="opportunities">改善機會</button></nav>
<main><div id="filters" class="filters" style="display:none"><label>配送類型<select id="typeFilter"><option value="all">全部</option><option value="own">自有外送</option><option value="third">第三方</option></select></label><label>RC<select id="rcFilter"><option value="all">全部</option></select></label><label>AC<select id="acFilter"><option value="all">全部</option></select></label><label>餐廳<select id="storeFilter"><option value="all">全部</option></select></label><label>開始日期<input type="date" id="startDate"></label><label>結束日期<input type="date" id="endDate"></label><label>星期<select id="weekdayFilter"><option value="all">全部</option><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option></select></label><label>餐期<select id="mealFilter"><option value="all">全部</option><option value="lunch">午餐 10:30–13:30</option><option value="tea">下午茶 13:30–17:00</option><option value="dinner">晚餐 17:00–21:00</option><option value="late">宵夜 21:00–24:00</option><option value="other">其他 00:00–10:30</option></select></label><label>Peak<select id="peakFilter"><option value="all">全部</option><option value="lunchPeak">午餐 Peak 11:30–13:30</option><option value="dinnerPeak">晚餐 Peak 17:30–19:30</option><option value="allPeak">全部 Peak</option><option value="nonPeak">Non-Peak</option></select></label><label>目標 TPLH<input type="number" id="tplhTarget" value="2.5" min="0.5" max="10" step="0.1" style="width:95px"></label><label>目標 D25%<input type="number" id="d25Target" value="80" min="0" max="100" step="1" style="width:95px"></label><label>清除篩選<button class="btn" id="clearFilter">全部資料</button></label></div>
<section id="welcome" class="card empty"><h2>請匯入 DMS 報表</h2><p>先匯入 ByOrder 訂單報表；再匯入 Rider Working 後會解鎖實際工時、TPLH、15 分鐘在班 Rider 與排班分析。六個中心可一次多選檔案。</p></section>
<section id="overview" class="page active"></section><section id="stores" class="page"></section><section id="orders" class="page"></section><section id="riders" class="page"></section><section id="demand" class="page"></section><section id="staffing" class="page"></section><section id="weekday" class="page"></section><section id="mealmerge" class="page"></section><section id="capacity" class="page"></section><section id="latefood" class="page"></section><section id="d25" class="page"></section><section id="opportunities" class="page"></section></main>
<script>
let raw=[], data=[], riderRaw=[], riderData=[], charts=[]; const $=id=>document.getElementById(id); const pct=(a,b)=>b?100*a/b:0; const fmt=n=>Number.isFinite(n)?n.toFixed(1):'-';
const WD=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function dt(v){if(!v)return null;if(v instanceof Date)return v;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d,d.H,d.M,d.S):null}let s=String(v).trim().replace(/-/g,'/');let d=new Date(s);return isNaN(d)?null:d} function mins(a,b){return a&&b?(b-a)/60000:null} function dateKey(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}
function parseDistance(v){let m=String(v||'').match(/[\d.]+/);return m?+m[0]:null} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function parseHours(v){if(v==null||v==='')return 0;if(typeof v==='number')return v<1?v*24:v;let m=String(v).match(/(\d+):(\d+)(?::(\d+))?/);return m?(+m[1]+(+m[2])/60+(+(m[3]||0))/3600):(+v||0)}
function minuteOfDay(d){return d?d.getHours()*60+d.getMinutes():null}
function mealPeriod(d){let m=minuteOfDay(d);if(m===null)return 'unknown';if(m>=630&&m<810)return 'lunch';if(m>=810&&m<1020)return 'tea';if(m>=1020&&m<1260)return 'dinner';if(m>=1260&&m<1440)return 'late';return 'other'}
function peakPeriod(d){let m=minuteOfDay(d);if(m===null)return 'none';if(m>=690&&m<810)return 'lunchPeak';if(m>=1050&&m<1170)return 'dinnerPeak';return 'nonPeak'}
function peakMatch(d,v){let p=peakPeriod(d);return v==='all'||p===v||(v==='allPeak'&&(p==='lunchPeak'||p==='dinnerPeak'))||(v==='nonPeak'&&p==='nonPeak')}
function mergeGroups(arr){let groups=[];let by=groupBy(arr.filter(x=>x.type==='own'&&x.employee&&x.store&&x.leaveStore),x=>x.employee+'|'+x.store+'|'+x.day);Object.values(by).forEach(a=>{a.sort((x,y)=>x.leaveStore-y.leaveStore);let g=[];let anchor=null;a.forEach(x=>{if(!g.length||((x.leaveStore-anchor)/60000)>5){if(g.length)groups.push(g);g=[x];anchor=x.leaveStore}else g.push(x)});if(g.length)groups.push(g)});return groups}
function mergeStats(arr){let own=arr.filter(x=>x.type==='own'),groups=mergeGroups(own),mg=groups.filter(g=>g.length>=2),orders=mg.reduce((n,g)=>n+g.length,0);return{own:own.length,mergeOrders:orders,mergeRate:pct(orders,own.length),mergeTrips:mg.length,avgMerge:mg.length?orders/mg.length:null,groups:mg}}
function normalize(r){let o={...r};o.orderId=r['reg order id'];o.rc=r['RC'];o.ac=r['AC'];o.store=r['ID'];o.mode=r['自動/手動'];o.orderTime=dt(r['落單時間']);o.eta=dt(r['預計送達時間']);o.originalEta=dt(r['原預計送達時間']);o.assign=dt(r['指派時間']);o.arriveStore=dt(r['門市到達時間']);o.leaveStore=dt(r['外送出發']);o.delivered=dt(r['到達時間']);o.employee=String(r['員工編號']||'');o.rider=r['外送員'];o.distance=parseDistance(r['距離']);o.d25=r['D25'];o.type=String(o.mode).includes('第三方')?'third':'own';o.assignLead=mins(o.assign,o.originalEta);o.arriveLead=mins(o.arriveStore,o.originalEta);o.storeWait=mins(o.arriveStore,o.leaveStore);o.assignToArrive=mins(o.assign,o.arriveStore);o.road=mins(o.leaveStore,o.delivered);o.total=mins(o.orderTime,o.delivered);
o.isD25=String(o.d25||'').trim().toUpperCase()==='Y';
o.isD25Late=String(o.d25||'').trim().toUpperCase()==='N';
o.longRoad=o.road!==null&&o.road>15;
o.lateAssign=o.assignLead!==null&&o.assignLead<=20;o.lateArrive=o.arriveLead!==null&&o.arriveLead<15;o.waitOver7=o.storeWait!==null&&!o.lateArrive&&o.storeWait>7;o.lateWaitOver5=o.storeWait!==null&&o.lateArrive&&o.storeWait>5;o.longWait=o.waitOver7||o.lateWaitOver5;o.day=dateKey(o.originalEta||o.orderTime);o.weekday=(o.originalEta||o.orderTime)?.getDay();return o}
function normalizeRider(r){let date=dt(r['日期']);let intervals=[];for(let i=1;i<=4;i++){let a=dt(r['IN'+i]),b=dt(r['OUT'+i]);if(a&&b)intervals.push([a,b])}return{employee:String(r['員工編號']||''),rider:r['員工姓名'],day:dateKey(date),weekday:date?.getDay(),date,intervals,hours:parseHours(r['總工時']),trips:+r['總外送趟次']||0,d25:parseFloat(String(r['D25%']||'').replace('%',''))||null,d7:parseFloat(String(r['D7%']||'').replace('%',''))||null}}
function unique(k){return [...new Set(raw.map(x=>x[k]).filter(Boolean))].sort()} function fillSelect(id,vals){$(id).innerHTML='<option value="all">全部</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('')}
function buildRiderCenterMap(){let dayMap=new Map(), empMap=new Map();raw.filter(x=>x.type==='own'&&x.employee&&x.rc&&x.day).forEach(x=>{let k=x.employee+'|'+x.day;if(!dayMap.has(k))dayMap.set(k,new Map());let m=dayMap.get(k);m.set(x.rc,(m.get(x.rc)||0)+1);if(!empMap.has(x.employee))empMap.set(x.employee,new Map());let e=empMap.get(x.employee);e.set(x.rc,(e.get(x.rc)||0)+1)});let pick=m=>m?[...m.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0]||null:null;riderRaw.forEach(r=>{r.rcMatched=pick(dayMap.get(r.employee+'|'+r.day));r.rcFallback=r.rcMatched?false:!!pick(empMap.get(r.employee));r.rc=r.rcMatched||pick(empMap.get(r.employee))||null})}
function filterRiders(){let sd=$('startDate').value,ed=$('endDate').value,w=$('weekdayFilter').value,rc=$('rcFilter').value;return riderRaw.filter(x=>(!sd||x.day>=sd)&&(!ed||x.day<=ed)&&(w==='all'||String(x.weekday)===w)&&(rc==='all'||x.rc===rc))}
function apply(){let sd=$('startDate').value,ed=$('endDate').value,w=$('weekdayFilter').value,meal=$('mealFilter').value,peak=$('peakFilter').value;buildRiderCenterMap();data=raw.filter(x=>{let t=x.originalEta||x.orderTime;return($('typeFilter').value==='all'||x.type===$('typeFilter').value)&&($('rcFilter').value==='all'||x.rc===$('rcFilter').value)&&($('acFilter').value==='all'||x.ac===$('acFilter').value)&&($('storeFilter').value==='all'||x.store===$('storeFilter').value)&&(!sd||x.day>=sd)&&(!ed||x.day<=ed)&&(w==='all'||String(x.weekday)===w)&&(meal==='all'||mealPeriod(t)===meal)&&peakMatch(t,peak)});riderData=filterRiders();renderAll()}
function kpi(title,count,valid,desc){return `<div class="card kpi"><div class="label">${title}</div><div class="value ${count&&valid?'bad':''}">${fmt(pct(count,valid))}%</div><div class="detail">${count.toLocaleString()} / ${valid.toLocaleString()} 筆${desc?' · '+desc:''}</div></div>`}
function groupBy(arr,key){let m={};arr.forEach(x=>{let k=typeof key==='function'?key(x):x[key]||'未分類';(m[k]??=[]).push(x)});return m} function validCount(arr,k){return arr.filter(x=>x[k]!==null).length} function avg(arr,k){let a=arr.map(x=>x[k]).filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]} function chart(id,type,labels,datasets,opts={}){let el=$(id);if(!el)return;charts.push(new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,position:'bottom'}},scales:type==='pie'?{}:{y:{beginAtZero:true}},...opts}}))}
function renderOverview(){let a=data,own=a.filter(x=>x.type==='own'),third=a.filter(x=>x.type==='third');let va=validCount(a,'assignLead'),vr=validCount(a,'arriveLead'),vw=validCount(a,'storeWait');let hrs=riderData.reduce((s,x)=>s+x.hours,0), trips=own.length;let byStore=Object.entries(groupBy(a,'store')).map(([s,z])=>({s,n:z.length,la:z.filter(x=>x.lateAssign).length,va:validCount(z,'assignLead'),lr:z.filter(x=>x.lateArrive).length,vr:validCount(z,'arriveLead'),lw:z.filter(x=>x.longWait).length,vw:validCount(z,'storeWait')})).sort((x,y)=>y.n-x.n).slice(0,12);
$('overview').innerHTML=`<div class="grid kpis"><div class="card kpi"><div class="label">分析訂單</div><div class="value">${a.length.toLocaleString()}</div><div class="detail">自有 ${own.length.toLocaleString()} · 第三方 ${third.length.toLocaleString()} · 第三方 ${fmt(pct(third.length,a.length))}%</div></div>${kpi('≤20 分鐘才指派',a.filter(x=>x.lateAssign).length,va,'距原預計送達')}${kpi('<15 分鐘才報到',a.filter(x=>x.lateArrive).length,vr,'距原預計送達')}${kpi('餐廳改善等待',a.filter(x=>x.longWait).length,vw,'餐廳等待')}</div>${riderRaw.length?`<div class="grid kpis"><div class="card kpi"><div class="label">Rider 實際工時</div><div class="value">${fmt(hrs)}</div><div class="detail">小時 · 依日期/星期篩選</div></div><div class="card kpi"><div class="label">實際 TPLH</div><div class="value">${hrs?fmt(trips/hrs):'-'}</div><div class="detail">篩選後自有 TC ÷ Rider 工時</div></div></div>`:''}<div class="grid two"><div class="card section"><h2>自有 vs 第三方異常率</h2><div class="chartbox"><canvas id="typeChart"></canvas></div></div><div class="card section"><h2>高 TC 餐廳效率</h2><div class="chartbox"><canvas id="storeChart"></canvas></div></div></div>`;
let rates=t=>{let z=a.filter(x=>x.type===t);return[pct(z.filter(x=>x.lateAssign).length,validCount(z,'assignLead')),pct(z.filter(x=>x.lateArrive).length,validCount(z,'arriveLead')),pct(z.filter(x=>x.longWait).length,validCount(z,'storeWait'))]};chart('typeChart','bar',['晚指派','晚報到','餐廳改善等待'],[{label:'自有',data:rates('own')},{label:'第三方',data:rates('third')}]);chart('storeChart','bar',byStore.map(x=>x.s),[{label:'晚指派%',data:byStore.map(x=>pct(x.la,x.va))},{label:'晚報到%',data:byStore.map(x=>pct(x.lr,x.vr))},{label:'餐廳改善等待%',data:byStore.map(x=>pct(x.lw,x.vw))}],{indexAxis:'y'})}
function renderStores(){let rows=Object.entries(groupBy(data,'store')).map(([s,z])=>({s,n:z.length,own:z.filter(x=>x.type==='own').length,third:z.filter(x=>x.type==='third').length,la:pct(z.filter(x=>x.lateAssign).length,validCount(z,'assignLead')),lr:pct(z.filter(x=>x.lateArrive).length,validCount(z,'arriveLead')),lw:pct(z.filter(x=>x.longWait).length,validCount(z,'storeWait')),lw7:pct(z.filter(x=>x.waitOver7).length,validCount(z,'storeWait')),lw57:pct(z.filter(x=>x.lateWaitOver5).length,validCount(z,'storeWait')),wait:avg(z,'storeWait'),road:avg(z,'road')})).sort((a,b)=>b.n-a.n);$('stores').innerHTML=`<div class="card section"><h2>各餐廳效率</h2><div class="tablewrap"><table><thead><tr><th>餐廳</th><th>TC</th><th>自有</th><th>第三方</th><th>≤20分才指派</th><th><15分才報到</th><th>等餐>7分%</th><th>Rider晚到＋等餐>5分%</th><th>改善合計%</th><th>平均店內等待</th><th>平均路程</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.s)}</td><td>${r.n}</td><td>${r.own}</td><td>${r.third}</td><td>${fmt(r.la)}%</td><td>${fmt(r.lr)}%</td><td>${fmt(r.lw7)}%</td><td>${fmt(r.lw57)}%</td><td>${fmt(r.lw)}%</td><td>${fmt(r.wait)}</td><td>${fmt(r.road)}</td></tr>`).join('')}</tbody></table></div></div>`}
function tags(x){let t=[];if(x.lateAssign)t.push('<span class="pill p-red">晚指派</span>');if(x.lateArrive)t.push('<span class="pill p-amber">晚報到</span>');if(x.longWait)t.push('<span class="pill p-blue">餐廳改善等待</span>');return t.join(' ')||'<span class="pill p-green">無核心異常</span>'}
function renderOrders(){let rows=data.slice().sort((a,b)=>(b.orderTime||0)-(a.orderTime||0));$('orders').innerHTML=`<div class="card section"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>訂單分析</h2><div class="note">顧客電話與完整地址不在 Dashboard 顯示。</div></div><input class="search" id="orderSearch" placeholder="搜尋訂單 / 餐廳 / 外送員"></div><div class="tablewrap"><table><thead><tr><th>訂單</th><th>餐廳</th><th>類型</th><th>原預計送達</th><th>指派剩餘</th><th>報到剩餘</th><th>店內等待</th><th>路程</th><th>距離</th><th>外送員</th><th>判斷</th></tr></thead><tbody id="orderBody">${orderRows(rows)}</tbody></table></div></div>`;$('orderSearch').oninput=e=>{let q=e.target.value.toLowerCase();$('orderBody').innerHTML=orderRows(rows.filter(x=>[x.orderId,x.store,x.rider].some(v=>String(v||'').toLowerCase().includes(q))))}}
function orderRows(rows){return rows.slice(0,1000).map(x=>`<tr><td>${esc(x.orderId)}</td><td>${esc(x.store)}</td><td>${x.type==='own'?'自有':'第三方'}</td><td>${x.originalEta?x.originalEta.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}</td><td>${fmt(x.assignLead)} 分</td><td>${fmt(x.arriveLead)} 分</td><td>${fmt(x.storeWait)} 分</td><td>${fmt(x.road)} 分</td><td>${fmt(x.distance)} km</td><td>${esc(x.rider||'-')}</td><td>${tags(x)}</td></tr>`).join('')}

function d25Base(){return data.filter(x=>x.type==='own'&&(x.isD25||x.isD25Late))}
function d25Reason(x){let r=[];if(x.lateAssign)r.push('晚指派');if(x.lateArrive)r.push('Rider晚報到');if(x.longWait)r.push('餐廳等餐過久');if(x.longRoad)r.push('配送>15分');return r.length?r:['其他']}
function renderD25(){
 let base=d25Base(), late=base.filter(x=>x.isD25Late), good=base.filter(x=>x.isD25), den=good.length+late.length;
 let target=Math.ceil(den*.8), gap=Math.max(0,target-good.length);
 let reasons=[['晚指派',late.filter(x=>x.lateAssign).length],['Rider晚報到',late.filter(x=>x.lateArrive).length],['正常到店＋等餐>7分',late.filter(x=>x.waitOver7).length],['Rider晚到＋等餐>5分',late.filter(x=>x.lateWaitOver5).length],['配送>15分',late.filter(x=>x.longRoad).length],['其他',late.filter(x=>d25Reason(x)[0]==='其他').length]];
 let stores=Object.entries(groupBy(late,'store')).map(([st,z])=>({st,n:z.length,tc:base.filter(x=>x.store===st).length,la:z.filter(x=>x.lateAssign).length,lr:z.filter(x=>x.lateArrive).length,lw:z.filter(x=>x.longWait).length,road:z.filter(x=>x.longRoad).length})).sort((a,b)=>b.n-a.n);
 let detail=late.slice().sort((a,b)=>(b.storeWait||0)-(a.storeWait||0));
 $('d25').innerHTML=`<div class="grid kpis">
 <div class="card kpi"><div class="label">D25</div><div class="value">${fmt(pct(good.length,den))}%</div><div class="detail">${good.length.toLocaleString()} / ${den.toLocaleString()} 筆 · 以 DMS 原始 Y/N 為準</div></div>
 <div class="card kpi"><div class="label">D25 遲到</div><div class="value bad">${late.length.toLocaleString()}</div><div class="detail">DMS D25=N</div></div>
 <div class="card kpi"><div class="label">距離 80% 還差</div><div class="value">${gap.toLocaleString()}</div><div class="detail">需增加的 D25=Y 筆數</div></div>
 <div class="card kpi"><div class="label">D25 有效母數</div><div class="value">${den.toLocaleString()}</div><div class="detail">僅 Y / N，排除空白與 -</div></div></div>
 <div class="grid two"><div class="card section"><h2>D25 遲到訊號</h2><div class="note">同一訂單可同時有多個訊號，因此件數可能重複。</div><div class="chartbox"><canvas id="d25ReasonChart"></canvas></div></div>
 <div class="card section"><h2>餐廳 D25 遲到排序</h2><div class="tablewrap"><table><thead><tr><th>餐廳</th><th>D25遲到</th><th>D25母數</th><th>晚指派</th><th>晚報到</th><th>餐廳改善</th><th>配送>15分</th></tr></thead><tbody>${stores.map(r=>`<tr><td>${esc(r.st)}</td><td>${r.n}</td><td>${r.tc}</td><td>${r.la}</td><td>${r.lr}</td><td>${r.lw}</td><td>${r.road}</td></tr>`).join('')}</tbody></table></div></div></div>
 <div class="card section"><h2>D25 遲到訂單明細</h2><div class="note">D25 是否遲到直接採 DMS 原始欄位，不自行推算「超時分鐘」。</div><div class="tablewrap"><table><thead><tr><th>訂單</th><th>餐廳</th><th>日期</th><th>指派剩餘</th><th>報到剩餘</th><th>等餐</th><th>配送</th><th>距離</th><th>原因訊號</th></tr></thead><tbody>${detail.slice(0,1000).map(x=>`<tr><td>${esc(x.orderId)}</td><td>${esc(x.store)}</td><td>${x.day}</td><td>${fmt(x.assignLead)}</td><td>${fmt(x.arriveLead)}</td><td>${fmt(x.storeWait)}</td><td>${fmt(x.road)}</td><td>${fmt(x.distance)}</td><td>${d25Reason(x).join('＋')}</td></tr>`).join('')}</tbody></table></div></div>`;
 chart('d25ReasonChart','bar',reasons.map(x=>x[0]),[{label:'遲到訂單數',data:reasons.map(x=>x[1])}]);
}
function renderOpportunities(){
 let late=d25Base().filter(x=>x.isD25Late);
 let stores=Object.entries(groupBy(data,'store')).map(([s,z])=>{let dl=late.filter(x=>x.store===s);return{s,n:z.length,d25late:dl.length,la:dl.filter(x=>x.lateAssign).length,lr:dl.filter(x=>x.lateArrive).length,lw:dl.filter(x=>x.longWait).length,road:dl.filter(x=>x.longRoad).length,wait:avg(z,'storeWait')}}).sort((a,b)=>b.d25late-a.d25late);
 let slots=Object.entries(groupBy(late,x=>`${WD[x.weekday]} ${slot(x.originalEta)}`)).map(([k,z])=>({k,n:z.length,la:z.filter(x=>x.lateAssign).length,lw:z.filter(x=>x.longWait).length})).sort((a,b)=>b.n-a.n).slice(0,10);
 let top=stores.slice(0,10);
 $('opportunities').innerHTML=`<div class="card section"><h2>D25 分析建議</h2><div class="note">以「影響訂單數」優先，不只看異常率。點擊表頭可排序。</div>${top.slice(0,5).map(x=>{let main=[['晚指派',x.la],['Rider晚報到',x.lr],['留店>7分',x.lw],['配送>15分',x.road]].sort((a,b)=>b[1]-a[1])[0];let advice=main[0]==='晚指派'?'優先檢視派單時間與尖峰 Rider 排班':main[0]==='Rider晚報到'?'優先檢視 Rider 供給、報到速度與派單距離':main[0]==='留店>7分'?'優先檢視餐廳出餐與交餐流程':'優先檢視配送距離、路線與併單情況';return`<div class="opportunity"><div class="metric-row"><b>${esc(x.s)}</b><strong>${x.d25late} 筆遲到</strong></div><div class="note">主要訊號：${main[0]} ${main[1]} 筆。${advice}。</div></div>`}).join('')}</div>
 <div class="grid two"><div class="card section"><h2>餐廳改善排序</h2><div class="tablewrap"><table class="sortable"><thead><tr><th>餐廳</th><th>D25遲到</th><th>晚指派</th><th>晚報到</th><th>留店餐廳改善</th><th>配送>15分</th></tr></thead><tbody>${top.map(x=>`<tr><td>${esc(x.s)}</td><td>${x.d25late}</td><td>${x.la}</td><td>${x.lr}</td><td>${x.lw}</td><td>${x.road}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card section"><h2>星期 × 時段遲到熱點</h2><div class="tablewrap"><table class="sortable"><thead><tr><th>星期 / 時段</th><th>D25遲到</th><th>晚指派</th><th>留店餐廳改善</th></tr></thead><tbody>${slots.map(x=>`<tr><td>${x.k}</td><td>${x.n}</td><td>${x.la}</td><td>${x.lw}</td></tr>`).join('')}</tbody></table></div></div></div>`
}
function makeSortable(){
 document.querySelectorAll('table').forEach(table=>{
  table.querySelectorAll('thead th').forEach((th,i)=>{
   if(th.dataset.sortBound)return; th.dataset.sortBound='1'; th.title='點擊排序';
   th.addEventListener('click',()=>{let body=table.tBodies[0];if(!body)return;let rows=[...body.rows],asc=th.dataset.dir!=='asc';table.querySelectorAll('th').forEach(x=>delete x.dataset.dir);th.dataset.dir=asc?'asc':'desc';
    rows.sort((a,b)=>{let A=a.cells[i]?.innerText.trim()||'',B=b.cells[i]?.innerText.trim()||'';let na=parseFloat(A.replace(/[%千,]/g,'')),nb=parseFloat(B.replace(/[%千,]/g,''));let c=(!isNaN(na)&&!isNaN(nb))?na-nb:A.localeCompare(B,'zh-Hant',{numeric:true});return asc?c:-c});rows.forEach(r=>body.appendChild(r));
   });
  });
 });
}
function renderAll(){destroyCharts();renderOverview();renderStores();renderOrders();renderRiders();renderDemand();renderStaffing();renderWeekday();renderMealMerge();renderCapacity();renderLateFood();renderD25();renderOpportunities();makeSortable()}
async function readFiles(files,kind){let all=[];for(const f of files){let buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});if(kind==='orders'){let ws=wb.Sheets['ByOrder']||wb.Sheets[wb.SheetNames[0]];all.push(...XLSX.utils.sheet_to_json(ws,{defval:null,raw:true}).map(normalize).filter(x=>x.orderId))}else{let ws=wb.Sheets['RiderWorking']||wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});let hdr=['No','員工編號','員工姓名','日期','IN1','OUT1','IN2','OUT2','IN3','OUT3','IN4','OUT4','總工時','總外送趟次','大雨趟次','超過21點趟次','D7%','D25%','平均留店時間','平均送達時間','滿意度','服務頂美'];let objs=rows.slice(2).map(row=>Object.fromEntries(hdr.map((h,i)=>[h,row[i]])));all.push(...objs.map(normalizeRider).filter(x=>x.employee&&x.day))}}return all}
$('orderFiles').addEventListener('change',async e=>{try{raw=await readFiles([...e.target.files],'orders');document.getElementById('importStatus').textContent=`訂單：${raw.length.toLocaleString()} 筆｜Rider Working：${riderRaw.length.toLocaleString()} 筆`;$('welcome').style.display='none';$('filters').style.display='flex';fillSelect('rcFilter',unique('rc'));fillSelect('acFilter',unique('ac'));fillSelect('storeFilter',unique('store'));let ds=raw.map(x=>x.day).filter(Boolean).sort();if(ds.length){$('startDate').value=ds[0];$('endDate').value=ds[ds.length-1]}apply()}catch(err){console.error(err);alert('訂單報表讀取失敗：'+err.message)}});$('riderFiles').addEventListener('change',async e=>{try{riderRaw=await readFiles([...e.target.files],'riders');buildRiderCenterMap();document.getElementById('importStatus').textContent=`訂單：${raw.length.toLocaleString()} 筆｜Rider Working：${riderRaw.length.toLocaleString()} 筆`;if(!riderRaw.length)alert('Rider Working 已選取，但沒有讀到有效資料。請確認工作表名稱或欄位格式。');apply()}catch(err){console.error(err);alert('Rider Working 讀取失敗：'+err.message)}});
['typeFilter','rcFilter','acFilter','storeFilter','startDate','endDate','weekdayFilter','mealFilter','peakFilter','tplhTarget','d25Target'].forEach(id=>$(id).addEventListener('change',apply));$('clearFilter').onclick=()=>{['typeFilter','rcFilter','acFilter','storeFilter','weekdayFilter','mealFilter','peakFilter'].forEach(id=>$(id).value='all');$('tplhTarget').value='2.5';$('d25Target').value='80';let ds=raw.map(x=>x.day).filter(Boolean).sort();$('startDate').value=ds[0]||'';$('endDate').value=ds[ds.length-1]||'';apply()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});$('orderBtn').onclick=()=>$('orderFiles').click();$('riderBtn').onclick=()=>$('riderFiles').click();$('exportStoreBtn').onclick=()=>exportExcel('store');$('exportAllBtn').onclick=()=>exportExcel('all');
</script></script></body></html>
