<!doctype html><html lang="zh-Hant" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS 外送效能 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6b7280;--line:#e5e7eb;--nav:#14283d;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:white;padding:18px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:5px}.upload{display:flex;gap:8px;align-items:center}.btn,input,select{border:1px solid #cfd6df;border-radius:8px;background:#fff;padding:9px 11px;font-size:14px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:#fff;color:#14283d}.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 18px;overflow:auto}.tab{padding:14px 16px;border:0;background:transparent;cursor:pointer;font-weight:700;color:#64748b;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}main{max-width:1500px;margin:auto;padding:18px}.filters,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #00000008}.filters{padding:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(180px,1fr));margin-bottom:12px}.kpi{padding:15px}.kpi .label{font-size:13px;color:var(--muted);font-weight:700}.kpi .value{font-size:28px;font-weight:800;margin:8px 0}.kpi .detail{font-size:12px;color:var(--muted)}.bad{color:var(--red)}.good{color:var(--green)}.two{grid-template-columns:1fr 1fr}.section{padding:16px;margin-bottom:12px}.section h2{font-size:16px;margin:0 0 12px}.chartbox{height:320px}.tablewrap{overflow:auto;max-height:600px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;z-index:1;cursor:pointer}th:first-child,td:first-child{text-align:left}.pill{padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}.p-red{background:#fee2e2;color:#991b1b}.p-amber{background:#fef3c7;color:#92400e}.p-blue{background:#dbeafe;color:#1e40af}.p-green{background:#dcfce7;color:#166534}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.5}.search{min-width:250px}.opportunity{padding:12px;border-left:4px solid var(--amber);background:#fffbeb;border-radius:8px;margin:8px 0}.metric-row{display:flex;justify-content:space-between;gap:10px}.metric-row strong{font-size:18px}.page-insight{padding:14px 16px;margin-bottom:12px;border-left:5px solid var(--blue)}.page-insight-grid{display:grid;grid-template-columns:1.1fr 1fr 1.5fr;gap:14px}.page-insight h3{font-size:13px;margin:0 0 6px;color:var(--muted)}.page-insight .big{font-weight:800;line-height:1.55}.page-insight .mini{font-size:12px;line-height:1.6}.store-chip{display:inline-block;padding:3px 7px;margin:2px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:700;font-size:11px}@media(max-width:900px){.page-insight-grid{grid-template-columns:1fr}.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two{grid-template-columns:1fr}.chartbox{height:260px}}

.page-insight-grid.actionable{grid-template-columns:1.05fr 1.55fr 1.15fr}.insight-action{padding:8px 0;border-bottom:1px solid #e5e7eb;display:grid;gap:3px}.insight-action:last-child{border-bottom:0}.insight-action span{font-size:12px;color:#64748b}.insight-action strong{font-size:13px;color:#111827;line-height:1.45}.action-text{line-height:1.65}@media(max-width:1000px){.page-insight-grid.actionable{grid-template-columns:1fr}}

.issue-list{display:grid;gap:8px}.issue-card{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:9px;padding:11px 13px;background:#fff}.issue-card.critical{border-left-color:var(--red)}.issue-title{font-weight:800;font-size:14px}.issue-meta{font-size:12px;color:var(--muted);margin:4px 0}.issue-action{font-size:13px;line-height:1.55}.page-insight{box-shadow:none}.page-insight-grid.actionable{grid-template-columns:.8fr 2.2fr}.kpis.compact .kpi .value{font-size:24px}.kpis.compact{grid-template-columns:repeat(4,minmax(170px,1fr))}@media(max-width:900px){.page-insight-grid.actionable{grid-template-columns:1fr}}

/* V24.10：縮小各頁分析摘要卡，讓資料表更快進入視線 */
.page-insight{padding:9px 12px;margin-bottom:8px;border-left-width:4px}
.page-insight-grid,.page-insight-grid.actionable{gap:8px}
.page-insight h3{font-size:11px;margin:0 0 3px}
.page-insight .big{font-size:13px;line-height:1.35}
.page-insight .mini{font-size:11px;line-height:1.4}
.insight-action{padding:4px 0;gap:1px}
.insight-action strong{font-size:12px;line-height:1.3}
.insight-action span{font-size:10px}
.action-text{font-size:12px;line-height:1.4}
.store-chip{padding:2px 5px;font-size:10px;margin:1px}
.issue-list{gap:6px}.issue-card{padding:8px 10px}.issue-title{font-size:13px}.issue-meta{font-size:11px;margin:2px 0}.issue-action{font-size:12px;line-height:1.4}
</style></head><body>
<header><div><h1>DMS 外送效能 Dashboard <span style="font-size:14px;font-weight:600;opacity:.75">V24.10</span></h1><div class="sub">Excel 僅在此瀏覽器中分析，不會上傳顧客資料</div></div><div class="upload"><input id="orderFiles" type="file" accept=".xlsx,.xls" multiple style="display:none"><input id="riderFiles" type="file" accept=".xlsx,.xls" multiple style="display:none"><button class="btn primary" id="orderBtn">匯入訂單報表（可多選）</button><button class="btn primary" id="riderBtn">匯入餐廳工時明細（可多選）</button><button class="btn primary" id="exportStoreBtn">匯出目前餐廳</button><button class="btn primary" id="exportAllBtn">匯出全部餐廳</button></div><div id="importStatus" style="font-size:13px;color:#dbeafe;margin-top:8px">訂單：尚未匯入｜外送任務工時：尚未匯入</div></header>
<nav class="tabs"><button class="tab active" data-page="summary">營運總結</button><button class="tab" data-page="overview">中心總覽</button><button class="tab" data-page="stores">餐廳效率</button><button class="tab" data-page="orders">訂單分析</button><button class="tab" data-page="riders">外送員效率</button><button class="tab" data-page="demand">訂單分布</button><button class="tab" data-page="staffing">人力＆排班</button><button class="tab" data-page="weekday">星期分析</button><button class="tab" data-page="mealmerge">餐期＆併單</button><button class="tab" data-page="capacity">運能決策</button><button class="tab" data-page="latefood">餐廳晚給餐</button><button class="tab" data-page="d25">D25 遲到分析</button></nav>
<main><div id="filters" class="filters" style="display:none"><label>配送類型<select id="typeFilter"><option value="all">全部</option><option value="own">自有外送</option><option value="third">第三方</option></select></label><label>RC<select id="rcFilter"><option value="all">全部</option></select></label><label>AC<select id="acFilter"><option value="all">全部</option></select></label><label>餐廳<select id="storeFilter"><option value="all">全部</option></select></label><label>開始日期<input type="date" id="startDate"></label><label>結束日期<input type="date" id="endDate"></label><label>星期<select id="weekdayFilter"><option value="all">全部</option><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option></select></label><label>餐期<select id="mealFilter"><option value="all">全部</option><option value="lunch">午餐 10:30–13:30</option><option value="tea">下午茶 13:30–17:00</option><option value="dinner">晚餐 17:00–21:00</option><option value="late">宵夜 21:00–24:00</option><option value="other">其他 00:00–10:30</option></select></label><label>Peak<select id="peakFilter"><option value="all">全部</option><option value="lunchPeak">午餐 Peak 11:30–13:30</option><option value="dinnerPeak">晚餐 Peak 17:30–19:30</option><option value="allPeak">全部 Peak</option><option value="nonPeak">Non-Peak</option></select></label><label>目標 TPLH<input type="number" id="tplhTarget" value="2.5" min="0.5" max="10" step="0.1" style="width:95px"></label><label>目標 D25%<input type="number" id="d25Target" value="80" min="0" max="100" step="1" style="width:95px"></label><label>清除篩選<button class="btn" id="clearFilter">全部資料</button></label></div>
<section id="welcome" class="card empty"><h2>請匯入 DMS 報表</h2><p>先匯入 ByOrder 訂單報表；再匯入「餐廳工時明細報表」。只有支援餐廳名稱為外送中心的工時才計入外送任務工時與 TPLH。</p></section>
<section id="summary" class="page active"></section><section id="overview" class="page"></section><section id="stores" class="page"></section><section id="orders" class="page"></section><section id="riders" class="page"></section><section id="demand" class="page"></section><section id="staffing" class="page"></section><section id="weekday" class="page"></section><section id="mealmerge" class="page"></section><section id="capacity" class="page"></section><section id="latefood" class="page"></section><section id="d25" class="page"></section></main>
<script>
let raw=[], data=[], riderRaw=[], riderData=[], charts=[]; const $=id=>document.getElementById(id); const pct=(a,b)=>b?100*a/b:0; const fmt=n=>Number.isFinite(n)?n.toFixed(1):'-';
const WD=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function unique(key){return [...new Set(raw.map(x=>x?.[key]).filter(v=>v!==null&&v!==undefined&&String(v).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant',{numeric:true}))}
function fillSelect(id,values){const el=$(id);if(!el)return;const current=el.value||'all';el.innerHTML='<option value="all">全部</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');el.value=[...el.options].some(o=>o.value===current)?current:'all'}
function cascadeFilters(changed){
 const rc=$('rcFilter').value, ac=$('acFilter').value;
 // RC 改變時，AC 只能顯示該 RC 實際出現的區域；若原 AC 不屬於該 RC，自動回到全部。
 if(changed==='rc'||changed==='init'){
   const acs=[...new Set(raw.filter(x=>rc==='all'||x.rc===rc).map(x=>x.ac).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant',{numeric:true}));
   fillSelect('acFilter',acs);
 }
 const acNow=$('acFilter').value;
 // 餐廳同時受 RC + AC 約束，不再出現其他中心／其他區域的餐廳。
 const stores=[...new Set(raw.filter(x=>(rc==='all'||x.rc===rc)&&(acNow==='all'||x.ac===acNow)).map(x=>x.store).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant',{numeric:true}));
 fillSelect('storeFilter',stores);
}
function dt(v){if(!v)return null;if(v instanceof Date)return v;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d,d.H,d.M,d.S):null}let s=String(v).trim().replace(/-/g,'/');let d=new Date(s);return isNaN(d)?null:d} function mins(a,b){return a&&b?(b-a)/60000:null} function dateKey(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}
function parseDistance(v){let m=String(v||'').match(/[\d.]+/);return m?+m[0]:null} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function parseHours(v){if(v==null||v==='')return 0;if(typeof v==='number')return v<1?v*24:v;let m=String(v).match(/(\d+):(\d+)(?::(\d+))?/);return m?(+m[1]+(+m[2])/60+(+(m[3]||0))/3600):(+v||0)}
function minuteOfDay(d){return d?d.getHours()*60+d.getMinutes():null}
function mealPeriod(d){let m=minuteOfDay(d);if(m===null)return 'unknown';if(m>=630&&m<810)return 'lunch';if(m>=810&&m<1020)return 'tea';if(m>=1020&&m<1260)return 'dinner';if(m>=1260&&m<1440)return 'late';return 'other'}
function peakPeriod(d){let m=minuteOfDay(d);if(m===null)return 'none';if(m>=690&&m<810)return 'lunchPeak';if(m>=1050&&m<1170)return 'dinnerPeak';return 'nonPeak'}
function peakMatch(d,v){let p=peakPeriod(d);return v==='all'||p===v||(v==='allPeak'&&(p==='lunchPeak'||p==='dinnerPeak'))||(v==='nonPeak'&&p==='nonPeak')}
function mergeGroups(arr){let groups=[];let by=groupBy(arr.filter(x=>x.type==='own'&&x.employee&&x.store&&x.leaveStore),x=>x.employee+'|'+x.store+'|'+x.day);Object.values(by).forEach(a=>{a.sort((x,y)=>x.leaveStore-y.leaveStore);let g=[];let anchor=null;a.forEach(x=>{if(!g.length||((x.leaveStore-anchor)/60000)>5){if(g.length)groups.push(g);g=[x];anchor=x.leaveStore}else g.push(x)});if(g.length)groups.push(g)});return groups}
function mergeStats(arr){let own=arr.filter(x=>x.type==='own'),groups=mergeGroups(own),mg=groups.filter(g=>g.length>=2),orders=mg.reduce((n,g)=>n+g.length,0);return{own:own.length,mergeOrders:orders,mergeRate:pct(orders,own.length),mergeTrips:mg.length,avgMerge:mg.length?orders/mg.length:null,groups:mg}}
function normalize(r){let o={...r};o.orderId=r['reg order id'];o.rc=r['RC'];o.ac=r['AC'];o.store=r['ID'];o.mode=r['自動/手動'];o.orderTime=dt(r['落單時間']);o.eta=dt(r['預計送達時間']);o.originalEta=dt(r['原預計送達時間']);o.assign=dt(r['指派時間']);o.arriveStore=dt(r['門市到達時間']);o.leaveStore=dt(r['外送出發']);o.delivered=dt(r['到達時間']);o.employee=String(r['員工編號']||'');o.rider=r['外送員'];o.distance=parseDistance(r['距離']);o.d25=r['D25'];o.type=String(o.mode).includes('第三方')?'third':'own';o.assignLead=mins(o.assign,o.originalEta);o.arriveLead=mins(o.arriveStore,o.originalEta);o.storeWait=mins(o.arriveStore,o.leaveStore);o.assignToArrive=mins(o.assign,o.arriveStore);o.road=mins(o.leaveStore,o.delivered);o.total=mins(o.orderTime,o.delivered);
o.isD25=String(o.d25||'').trim().toUpperCase()==='Y';
o.isD25Late=String(o.d25||'').trim().toUpperCase()==='N';
o.longRoad=o.road!==null&&o.road>15;
o.lateAssign=o.assignLead!==null&&o.assignLead<=20;o.lateArrive=o.arriveLead!==null&&o.arriveLead<15;o.waitOver7=o.storeWait!==null&&!o.lateArrive&&o.storeWait>7;o.lateWaitOver5=o.storeWait!==null&&o.lateArrive&&o.storeWait>5;o.longWait=o.waitOver7||o.lateWaitOver5;o.day=dateKey(o.originalEta||o.orderTime);o.weekday=(o.originalEta||o.orderTime)?.getDay();return o}
function isDeliveryCenterName(v){return /外送中心/.test(String(v||''))}
function rcFromSupportName(v){let m=String(v||'').match(/I\d{3}-([^\s]+外送中心)/);return m?m[1]:String(v||'').replace(/^I\d{3}-/,'').trim()||null}
function combineDateTime(dateVal,timeVal){let d=dt(dateVal);if(!d||timeVal==null||timeVal==='')return null;let h=0,m=0,sec=0;if(timeVal instanceof Date){h=timeVal.getHours();m=timeVal.getMinutes();sec=timeVal.getSeconds()}else if(typeof timeVal==='number'&&timeVal<1){let total=Math.round(timeVal*86400);h=Math.floor(total/3600);m=Math.floor((total%3600)/60);sec=total%60}else{let z=String(timeVal).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!z)return null;h=+z[1];m=+z[2];sec=+(z[3]||0)}return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m,sec)}
function normalizeRider(r){let support=r['支援餐廳名稱'],valid=isDeliveryCenterName(support);if(!valid)return null;let date=dt(r['支援日期']||r['日結日期']),intervals=[];for(let i=1;i<=3;i++){let a=combineDateTime(date,r['IN'+i]),b=combineDateTime(date,r['OUT'+i]);if(a&&b&&b>a)intervals.push([a,b])}let intervalHours=intervals.reduce((s,[a,b])=>s+(b-a)/3600000,0);return{employee:String(r['員工編號']||''),rider:r['員工姓名'],day:dateKey(date),weekday:date?.getDay(),date,intervals,hours:intervalHours||parseHours(r['總工時']),trips:+r['外送總趟次']||0,rc:rcFromSupportName(support),supportStore:support,homeStore:r['所屬餐廳名稱']||'',position:String(r['職級']||'').trim(),rcMatched:true}}
function buildRiderCenterMap(){/* 工時中心直接以「支援餐廳名稱」判斷，不再由訂單反推 */}
function allowedTime(d){let meal=$('mealFilter').value,peak=$('peakFilter').value;return(meal==='all'||mealPeriod(d)===meal)&&peakMatch(d,peak)}
function effectiveHours(r){if(!r||!r.intervals?.length)return r?.hours||0;let ms=0;r.intervals.forEach(([a,b])=>{let t=new Date(a);while(t<b){let next=new Date(Math.min(b.getTime(),t.getTime()+60000));if(allowedTime(t))ms+=next-t;t=next}});return ms/3600000}
function filterRiders(){let sd=$('startDate').value,ed=$('endDate').value,w=$('weekdayFilter').value,rc=$('rcFilter').value;return riderRaw.filter(x=>(!sd||x.day>=sd)&&(!ed||x.day<=ed)&&(w==='all'||String(x.weekday)===w)&&(rc==='all'||x.rc===rc))}
function apply(){let sd=$('startDate').value,ed=$('endDate').value,w=$('weekdayFilter').value,meal=$('mealFilter').value,peak=$('peakFilter').value;buildRiderCenterMap();data=raw.filter(x=>{let t=x.originalEta||x.orderTime;return($('typeFilter').value==='all'||x.type===$('typeFilter').value)&&($('rcFilter').value==='all'||x.rc===$('rcFilter').value)&&($('acFilter').value==='all'||x.ac===$('acFilter').value)&&($('storeFilter').value==='all'||x.store===$('storeFilter').value)&&(!sd||x.day>=sd)&&(!ed||x.day<=ed)&&(w==='all'||String(x.weekday)===w)&&(meal==='all'||mealPeriod(t)===meal)&&peakMatch(t,peak)});riderData=filterRiders();renderAll()}
function kpi(title,count,valid,desc){return `<div class="card kpi"><div class="label">${title}</div><div class="value ${count&&valid?'bad':''}">${fmt(pct(count,valid))}%</div><div class="detail">${count.toLocaleString()} / ${valid.toLocaleString()} 筆${desc?' · '+desc:''}</div></div>`}
function groupBy(arr,key){let m={};arr.forEach(x=>{let k=typeof key==='function'?key(x):x[key]||'未分類';(m[k]??=[]).push(x)});return m} function validCount(arr,k){return arr.filter(x=>x[k]!==null).length} function avg(arr,k){let a=arr.map(x=>x[k]).filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}

function exportSheet(wb,name,rows,opts={}){

 rows.forEach(r=>aoa.push(headers.map(h=>r[h])));

   if(!items.length)tr.sort((a,b)=>b.score-a.score).slice(0,3).forEach(r=>add(`${r.time}｜${r.rec}`,`${r.tc} TC｜平均 ${fmt(r.avgSize)}單/趟｜D25 ${fmt(r.d25)}%`,r.reason,r.score));
 } else if(page==='capacity'){
   let g=groupBy(data,x=>{let d=x.originalEta;if(!d)return '未分類';return `${String(d.getHours()).padStart(2,'0')}:${d.getMinutes()<30?'00':'30'}`});Object.entries(g).forEach(([k,z])=>{if(k==='未分類')return;let d=d25Rate(z),third=pct(z.filter(x=>x.type==='third').length,z.length),lr=pct(z.filter(x=>x.lateArrive).length,validCount(z,'arriveLead')),m=mergeStats(z);let action=lr>=15&&Number.isFinite(d)&&d<targets.d25?'下次在此30分鐘前完成 Rider 配置；先前移工時，再評估增加總工時。':m.avgMerge>=3&&Number.isFinite(d)&&d<targets.d25?'併單偏高且 D25 未達，下次降低高併單並以第三方分流尖峰。':third>=20&&(!Number.isFinite(d)||d>=targets.d25)?'D25有餘裕，可檢查第三方是否能回收部分短距離單提升 TPLH。':'維持配置並觀察相同餐期。';add(k,`${z.length} TC｜D25 ${fmt(d)}%｜第三方 ${fmt(third)}%｜平均併單 ${fmt(m.avgMerge)}`,action,z.length*(1+lr/50+(Number.isFinite(d)?Math.max(0,targets.d25-d)/20:0)));});
 } else if(page==='latefood'){
   Object.entries(groupBy(own,'store')).forEach(([s,z])=>{let bad=z.filter(x=>x.longWait),late=bad.filter(x=>String(x.d25).toUpperCase()==='N').length;if(!bad.length)return;add(s,`${bad.length}筆需改善｜其中 D25=N ${late}筆｜平均等待 ${fmt(avg(bad,'storeWait'))}分`,'不先增加 Rider；優先改善備餐、隨到隨取，並往下找最集中的30分鐘。',bad.length+late*2);});
 } else if(page==='d25'){
   let late=own.filter(x=>String(x.d25).toUpperCase()==='N'),types=[['Rider晚到',x=>x.lateArrive,'優先回查30分鐘人力與 Rider 前一趟配送。'],['餐廳等餐',x=>x.longWait,'優先改善問題餐廳 Peak 備餐。'],['晚指派',x=>x.lateAssign,'優先檢查接近 ETA 才派單的時段。']];types.forEach(([n,f,a])=>{let z=late.filter(f);if(z.length)add(n,`${z.length}筆｜占 D25=N ${fmt(pct(z.length,late.length))}%`,a,z.length)});let other=late.filter(x=>!x.lateArrive&&!x.longWait&&!x.lateAssign);if(other.length)add('其他 D25 遲到',`${other.length}筆｜目前三項訊號皆未命中`,'再往配送距離、路程時間與訂單明細查。',other.length);
 }
 items.sort((a,b)=>b.score-a.score);items=items.slice(0,3);
 let cards=items.map((r,i)=>`<div class="issue-card ${i===0?'critical':''}"><div class="issue-title">${i+1}. ${esc(r.title)}</div><div class="issue-meta">${esc(r.meta)}</div><div class="issue-action">${esc(r.action)}</div></div>`).join('');
 return `<div class="card page-insight"><div class="page-insight-grid actionable"><div><h3>${esc(labels[page]||'本頁')}｜分析重點</h3><div class="big">${esc(purpose)}</div></div><div><h3>依本頁資料判斷的 Top ${items.length||0}</h3><div class="issue-list">${cards||'<div class="mini">目前沒有足夠資料或沒有明顯異常。</div>'}</div></div></div></div>`;
}
function injectInsights(){['overview','stores','orders','riders','demand','staffing','weekday','mealmerge','capacity','latefood','d25'].forEach(id=>{let el=$(id);if(el&&el.innerHTML&&!el.querySelector('.page-insight'))el.insertAdjacentHTML('afterbegin',insightFor(id))})}

function renderAll(){renderSummary();destroyCharts();renderOverview();renderStores();renderOrders();renderRiders();renderDemand();renderStaffing();renderWeekday();renderMealMerge();renderCapacity();renderLateFood();renderD25();injectInsights();makeSortable()}
async function readFiles(files,kind){let all=[];for(const f of files){let buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});if(kind==='orders'){let ws=wb.Sheets['ByOrder']||wb.Sheets[wb.SheetNames[0]];all.push(...XLSX.utils.sheet_to_json(ws,{defval:null,raw:true}).map(normalize).filter(x=>x.orderId))}else{let ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});const cleanHeader=v=>String(v??'').replace(/[\s\u3000\r\n]+/g,'').trim();let hi=rows.findIndex(row=>{let h=row.map(cleanHeader);return h.some(x=>x.includes('支援餐廳名稱'))&&h.some(x=>x.includes('員工編號'))});let objs=[];if(hi>=0){let hdr=rows[hi].map(cleanHeader);objs=rows.slice(hi+1).map(row=>Object.fromEntries(hdr.map((h,i)=>[h,row[i]])))}else{/* 部分匯出檔在 SheetJS 中會把前5列標題區裁掉，直接從資料列開始；此時依官方報表固定欄位位置回復欄名 */const fixed=['FT/PT','工時型態','所屬RC','所屬AC','所屬餐廳店號','所屬餐廳名稱','員工編號','員工姓名','職級','日結日期','支援日期','支援餐廳店號','支援餐廳名稱','IN1','OUT1','IN2','OUT2','IN3','OUT3','總工時'];let looksLikeData=rows.some(r=>r.length>=20&&String(r[4]??'').trim()!==''&&String(r[5]??'').trim()!==''&&String(r[6]??'').trim()!=='');if(!looksLikeData){let preview=rows.slice(0,8).map(r=>r.map(cleanHeader).filter(Boolean).join('｜')).filter(Boolean).join(' / ');throw new Error('找不到工時報表欄位，且無法辨識固定欄位格式。讀到的前幾列：'+preview)}objs=rows.map(row=>Object.fromEntries(fixed.map((h,i)=>[h,row[i]])))}all.push(...objs.map(normalizeRider).filter(x=>x&&x.employee&&x.day))}}return all}
$('orderFiles').addEventListener('change',async e=>{try{raw=await readFiles([...e.target.files],'orders');document.getElementById('importStatus').textContent=`訂單：${raw.length.toLocaleString()} 筆｜外送任務工時：${riderRaw.length.toLocaleString()} 筆`;$('welcome').style.display='none';$('filters').style.display='flex';fillSelect('rcFilter',unique('rc'));cascadeFilters('init');let ds=raw.map(x=>x.day).filter(Boolean).sort();if(ds.length){$('startDate').value=ds[0];$('endDate').value=ds[ds.length-1]}apply()}catch(err){console.error(err);alert('訂單報表讀取失敗：'+err.message)}});$('riderFiles').addEventListener('change',async e=>{try{riderRaw=await readFiles([...e.target.files],'riders');buildRiderCenterMap();document.getElementById('importStatus').textContent=`訂單：${raw.length.toLocaleString()} 筆｜外送任務工時：${riderRaw.length.toLocaleString()} 筆`;if(!riderRaw.length)alert('工時報表已選取，但沒有讀到「支援餐廳名稱為外送中心」的有效工時。');apply()}catch(err){console.error(err);alert('餐廳工時明細讀取失敗：'+err.message)}});
['typeFilter','storeFilter','startDate','endDate','weekdayFilter','mealFilter','peakFilter','tplhTarget','d25Target'].forEach(id=>$(id).addEventListener('change',apply));
$('rcFilter').addEventListener('change',()=>{cascadeFilters('rc');apply()});
$('acFilter').addEventListener('change',()=>{cascadeFilters('ac');apply()});$('clearFilter').onclick=()=>{['typeFilter','rcFilter','acFilter','storeFilter','weekdayFilter','mealFilter','peakFilter'].forEach(id=>$(id).value='all');$('tplhTarget').value='2.5';$('d25Target').value='80';let ds=raw.map(x=>x.day).filter(Boolean).sort();$('startDate').value=ds[0]||'';$('endDate').value=ds[ds.length-1]||'';cascadeFilters('init');apply()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});$('orderBtn').onclick=()=>$('orderFiles').click();$('riderBtn').onclick=()=>$('riderFiles').click();$('exportStoreBtn').onclick=()=>exportExcel('store');$('exportAllBtn').onclick=()=>exportExcel('all');
</script></body></html>
