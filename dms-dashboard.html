<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS 外送效能 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6b7280;--line:#e5e7eb;--nav:#14283d;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:white;padding:18px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:5px}.upload{display:flex;gap:8px;align-items:center}.btn,input,select{border:1px solid #cfd6df;border-radius:8px;background:#fff;padding:9px 11px;font-size:14px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:#fff;color:#14283d}.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 18px;overflow:auto}.tab{padding:14px 16px;border:0;background:transparent;cursor:pointer;font-weight:700;color:#64748b;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}main{max-width:1500px;margin:auto;padding:18px}.filters,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #00000008}.filters{padding:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,minmax(180px,1fr));margin-bottom:12px}.kpi{padding:15px}.kpi .label{font-size:13px;color:var(--muted);font-weight:700}.kpi .value{font-size:28px;font-weight:800;margin:8px 0}.kpi .detail{font-size:12px;color:var(--muted)}.bad{color:var(--red)}.good{color:var(--green)}.two{grid-template-columns:1fr 1fr}.section{padding:16px;margin-bottom:12px}.section h2{font-size:16px;margin:0 0 12px}.chartbox{height:320px}.tablewrap{overflow:auto;max-height:600px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;z-index:1;cursor:pointer}th:first-child,td:first-child{text-align:left}.pill{padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}.p-red{background:#fee2e2;color:#991b1b}.p-amber{background:#fef3c7;color:#92400e}.p-blue{background:#dbeafe;color:#1e40af}.p-green{background:#dcfce7;color:#166534}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.5}.search{min-width:250px}.opportunity{padding:12px;border-left:4px solid var(--amber);background:#fffbeb;border-radius:8px;margin:8px 0}.metric-row{display:flex;justify-content:space-between;gap:10px}.metric-row strong{font-size:18px}@media(max-width:900px){.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two{grid-template-columns:1fr}.chartbox{height:260px}}
</style></head><body>
<header><div><h1>DMS 外送效能 Dashboard</h1><div class="sub">Excel 僅在此瀏覽器中分析，不會上傳顧客資料</div></div><div class="upload"><input id="file" type="file" accept=".xlsx,.xls"><button class="btn primary" id="demoInfo">匯入 DMS Excel</button></div></header>
<nav class="tabs"><button class="tab active" data-page="overview">中心總覽</button><button class="tab" data-page="stores">餐廳效率</button><button class="tab" data-page="orders">訂單分析</button><button class="tab" data-page="riders">外送員效率</button><button class="tab" data-page="demand">訂單分布 / 人力</button><button class="tab" data-page="opportunities">改善機會</button></nav>
<main><div id="filters" class="filters" style="display:none"><label>配送類型<select id="typeFilter"><option value="all">全部</option><option value="own">自有外送</option><option value="third">第三方</option></select></label><label>RC<select id="rcFilter"><option value="all">全部</option></select></label><label>AC<select id="acFilter"><option value="all">全部</option></select></label><label>餐廳<select id="storeFilter"><option value="all">全部</option></select></label><label>日期<input type="date" id="dateFilter"></label><label>清除篩選<button class="btn" id="clearFilter">全部資料</button></label></div>
<section id="welcome" class="card empty"><h2>請匯入 DMS 報表</h2><p>支援你目前的 ByOrder Excel 格式。匯入後會自動建立中心、餐廳、訂單、外送員與人力需求分析。</p></section>
<section id="overview" class="page active"></section><section id="stores" class="page"></section><section id="orders" class="page"></section><section id="riders" class="page"></section><section id="demand" class="page"></section><section id="opportunities" class="page"></section></main>
<script>
let raw=[], data=[], charts=[]; const $=id=>document.getElementById(id); const pct=(a,b)=>b?100*a/b:0; const fmt=n=>Number.isFinite(n)?n.toFixed(1):'-';
function dt(v){if(!v)return null;if(v instanceof Date)return v; if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d,d.H,d.M,d.S):null}let s=String(v).trim().replace(/-/g,'/');let d=new Date(s);return isNaN(d)?null:d} function mins(a,b){return a&&b?(b-a)/60000:null} function dateKey(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}
function parseDistance(v){let m=String(v||'').match(/[\d.]+/);return m?+m[0]:null} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalize(r){let o={...r};o.orderId=r['reg order id'];o.rc=r['RC'];o.ac=r['AC'];o.store=r['ID'];o.mode=r['自動/手動'];o.orderTime=dt(r['落單時間']);o.eta=dt(r['預計送達時間']);o.originalEta=dt(r['原預計送達時間']);o.assign=dt(r['指派時間']);o.arriveStore=dt(r['門市到達時間']);o.leaveStore=dt(r['外送出發']);o.delivered=dt(r['到達時間']);o.employee=r['員工編號'];o.rider=r['外送員'];o.distance=parseDistance(r['距離']);o.d25=r['D25'];o.type=String(o.mode).includes('第三方')?'third':'own';o.assignLead=mins(o.assign,o.originalEta);o.arriveLead=mins(o.arriveStore,o.originalEta);o.storeWait=mins(o.arriveStore,o.leaveStore);o.assignToArrive=mins(o.assign,o.arriveStore);o.road=mins(o.leaveStore,o.delivered);o.total=mins(o.orderTime,o.delivered);o.lateAssign=o.assignLead!==null&&o.assignLead<=20;o.lateArrive=o.arriveLead!==null&&o.arriveLead<15;o.longWait=o.storeWait!==null&&o.storeWait>10;o.day=dateKey(o.originalEta||o.orderTime);return o}
function unique(k){return [...new Set(raw.map(x=>x[k]).filter(Boolean))].sort()} function fillSelect(id,vals){$(id).innerHTML='<option value="all">全部</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('')}
function apply(){data=raw.filter(x=>($('typeFilter').value==='all'||x.type===$('typeFilter').value)&&($('rcFilter').value==='all'||x.rc===$('rcFilter').value)&&($('acFilter').value==='all'||x.ac===$('acFilter').value)&&($('storeFilter').value==='all'||x.store===$('storeFilter').value)&&(!$('dateFilter').value||x.day===$('dateFilter').value));renderAll()}
function kpi(title,count,valid,desc){return `<div class="card kpi"><div class="label">${title}</div><div class="value ${count&&valid?'bad':''}">${fmt(pct(count,valid))}%</div><div class="detail">${count.toLocaleString()} / ${valid.toLocaleString()} 筆${desc?' · '+desc:''}</div></div>`}
function groupBy(arr,key){let m={};arr.forEach(x=>{let k=typeof key==='function'?key(x):x[key]||'未分類';(m[k]??=[]).push(x)});return m} function validCount(arr,k){return arr.filter(x=>x[k]!==null).length}
function avg(arr,k){let a=arr.map(x=>x[k]).filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]} function chart(id,type,labels,datasets,opts={}){let el=$(id);if(!el)return;charts.push(new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,position:'bottom'}},scales:type==='pie'?{}:{y:{beginAtZero:true}},...opts}}))}
function renderOverview(){let a=data, own=a.filter(x=>x.type==='own'),third=a.filter(x=>x.type==='third');let va=validCount(a,'assignLead'),vr=validCount(a,'arriveLead'),vw=validCount(a,'storeWait');let byStore=Object.entries(groupBy(a,'store')).map(([s,z])=>({s,n:z.length,la:z.filter(x=>x.lateAssign).length,va:validCount(z,'assignLead'),lr:z.filter(x=>x.lateArrive).length,vr:validCount(z,'arriveLead'),lw:z.filter(x=>x.longWait).length,vw:validCount(z,'storeWait')})).sort((x,y)=>y.n-x.n).slice(0,12);
$('overview').innerHTML=`<div class="grid kpis"><div class="card kpi"><div class="label">分析訂單</div><div class="value">${a.length.toLocaleString()}</div><div class="detail">自有 ${own.length.toLocaleString()} · 第三方 ${third.length.toLocaleString()} · 第三方 ${fmt(pct(third.length,a.length))}%</div></div>${kpi('≤20 分鐘才指派',a.filter(x=>x.lateAssign).length,va,'距原預計送達')}${kpi('<15 分鐘才報到',a.filter(x=>x.lateArrive).length,vr,'距原預計送達')}${kpi('報到後 >10 分才離店',a.filter(x=>x.longWait).length,vw,'餐廳等待')}</div><div class="grid two"><div class="card section"><h2>自有 vs 第三方異常率</h2><div class="chartbox"><canvas id="typeChart"></canvas></div></div><div class="card section"><h2>高 TC 餐廳效率</h2><div class="chartbox"><canvas id="storeChart"></canvas></div></div></div><div class="card section"><h2>時間拆解</h2><div class="grid kpis"><div class="kpi"><div class="label">平均 指派→報到</div><div class="value">${fmt(avg(a,'assignToArrive'))}</div><div class="detail">分鐘</div></div><div class="kpi"><div class="label">平均 報到→離店</div><div class="value">${fmt(avg(a,'storeWait'))}</div><div class="detail">分鐘</div></div><div class="kpi"><div class="label">平均 離店→送達</div><div class="value">${fmt(avg(a,'road'))}</div><div class="detail">分鐘</div></div><div class="kpi"><div class="label">平均 全程</div><div class="value">${fmt(avg(a,'total'))}</div><div class="detail">落單→送達 分鐘</div></div></div></div>`;
let rates=t=>{let z=a.filter(x=>x.type===t);return [pct(z.filter(x=>x.lateAssign).length,validCount(z,'assignLead')),pct(z.filter(x=>x.lateArrive).length,validCount(z,'arriveLead')),pct(z.filter(x=>x.longWait).length,validCount(z,'storeWait'))]};let ro=rates('own'),rt=rates('third');chart('typeChart','bar',['晚指派','晚報到','>10分離店'],[{label:'自有',data:ro},{label:'第三方',data:rt}]);chart('storeChart','bar',byStore.map(x=>x.s),[{label:'晚指派%',data:byStore.map(x=>pct(x.la,x.va))},{label:'晚報到%',data:byStore.map(x=>pct(x.lr,x.vr))},{label:'>10分離店%',data:byStore.map(x=>pct(x.lw,x.vw))}],{indexAxis:'y'});}
function renderStores(){let rows=Object.entries(groupBy(data,'store')).map(([s,z])=>({s,n:z.length,own:z.filter(x=>x.type==='own').length,third:z.filter(x=>x.type==='third').length,la:pct(z.filter(x=>x.lateAssign).length,validCount(z,'assignLead')),lr:pct(z.filter(x=>x.lateArrive).length,validCount(z,'arriveLead')),lw:pct(z.filter(x=>x.longWait).length,validCount(z,'storeWait')),wait:avg(z,'storeWait'),road:avg(z,'road'),d25:pct(z.filter(x=>String(x.d25).toUpperCase()==='Y').length,z.filter(x=>['Y','N'].includes(String(x.d25).toUpperCase())).length)})).sort((a,b)=>b.n-a.n);$('stores').innerHTML=`<div class="card section"><h2>各餐廳效率</h2><div class="note">可搭配上方「自有外送 / 第三方」篩選，避免兩種配送模式混在一起。</div><div class="tablewrap"><table><thead><tr><th>餐廳</th><th>TC</th><th>自有</th><th>第三方</th><th>≤20分才指派</th><th><15分才報到</th><th>>10分離店</th><th>平均店內等待</th><th>平均路程</th><th>D25</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.s)}</td><td>${r.n}</td><td>${r.own}</td><td>${r.third}</td><td>${fmt(r.la)}%</td><td>${fmt(r.lr)}%</td><td>${fmt(r.lw)}%</td><td>${fmt(r.wait)}</td><td>${fmt(r.road)}</td><td>${fmt(r.d25)}%</td></tr>`).join('')}</tbody></table></div></div>`}
function tags(x){let t=[];if(x.lateAssign)t.push('<span class="pill p-red">晚指派</span>');if(x.lateArrive)t.push('<span class="pill p-amber">晚報到</span>');if(x.longWait)t.push('<span class="pill p-blue">店內>10分</span>');return t.join(' ')||'<span class="pill p-green">無核心異常</span>'}
function renderOrders(){let rows=data.slice().sort((a,b)=>(b.orderTime||0)-(a.orderTime||0));$('orders').innerHTML=`<div class="card section"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>訂單分析</h2><div class="note">顧客電話與完整地址不在 Dashboard 顯示。</div></div><input class="search" id="orderSearch" placeholder="搜尋訂單 / 餐廳 / 外送員"></div><div class="tablewrap"><table><thead><tr><th>訂單</th><th>餐廳</th><th>類型</th><th>原預計送達</th><th>指派剩餘</th><th>報到剩餘</th><th>店內等待</th><th>路程</th><th>距離</th><th>外送員</th><th>判斷</th></tr></thead><tbody id="orderBody">${orderRows(rows)}</tbody></table></div></div>`;$('orderSearch').oninput=e=>{let q=e.target.value.toLowerCase();$('orderBody').innerHTML=orderRows(rows.filter(x=>[x.orderId,x.store,x.rider].some(v=>String(v||'').toLowerCase().includes(q))))}}
function orderRows(rows){return rows.slice(0,1000).map(x=>`<tr><td>${esc(x.orderId)}</td><td>${esc(x.store)}</td><td>${x.type==='own'?'自有':'第三方'}</td><td>${x.originalEta?x.originalEta.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}</td><td>${fmt(x.assignLead)} 分</td><td>${fmt(x.arriveLead)} 分</td><td>${fmt(x.storeWait)} 分</td><td>${fmt(x.road)} 分</td><td>${fmt(x.distance)} km</td><td>${esc(x.rider||'-')}</td><td>${tags(x)}</td></tr>`).join('')}
function renderRiders(){let own=data.filter(x=>x.type==='own'&&x.rider);let rows=Object.entries(groupBy(own,x=>`${x.employee||''}|${x.rider}`)).map(([k,z])=>{let [id,n]=k.split('|');return{id,n,tc:z.length,a:avg(z,'assignToArrive'),report6:pct(z.filter(x=>Number.isFinite(x.assignToArrive)&&x.assignToArrive<=6).length,validCount(z,'assignToArrive')),wait:avg(z,'storeWait'),wait10:pct(z.filter(x=>x.longWait).length,validCount(z,'storeWait')),road:avg(z,'road'),dist:avg(z,'distance'),d25:pct(z.filter(x=>String(x.d25).toUpperCase()==='Y').length,z.filter(x=>['Y','N'].includes(String(x.d25).toUpperCase())).length)}}).sort((a,b)=>b.tc-a.tc);$('riders').innerHTML=`<div class="card section"><h2>自有外送員效率</h2><div class="note">第三方訂單不納入外送員效率。指標用來定位流程差異，需搭配距離、餐廳等待與時段判讀。</div><div class="tablewrap"><table><thead><tr><th>外送員</th><th>員編</th><th>TC</th><th>平均指派→報到</th><th>≤6分</th><th>平均店內等待</th><th>>10分</th><th>平均路程</th><th>平均距離</th><th>D25</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.id)}</td><td>${r.tc}</td><td>${fmt(r.a)}</td><td>${fmt(r.report6)}%</td><td>${fmt(r.wait)}</td><td>${fmt(r.wait10)}%</td><td>${fmt(r.road)}</td><td>${fmt(r.dist)} km</td><td>${fmt(r.d25)}%</td></tr>`).join('')}</tbody></table></div></div>`}
function slot(d){if(!d)return null;let m=Math.floor(d.getMinutes()/15)*15;return `${String(d.getHours()).padStart(2,'0')}:${String(m).padStart(2,'0')}`} function renderDemand(){let m=groupBy(data,x=>slot(x.originalEta));delete m['未分類'];let labels=Object.keys(m).sort();$('demand').innerHTML=`<div class="card section"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2>原預計送達時間分布</h2><div class="note">每 15 分鐘一區間。建議 Rider = 該區間 TC × 4 ÷ TPLH；這是需求等效試算，不等於實際排班人數。</div></div><label>TPLH 目標 <input id="tplh" type="number" value="2" min="0.5" step="0.1" style="width:90px"></label></div><div class="chartbox"><canvas id="demandChart"></canvas></div><div class="tablewrap"><table><thead><tr><th>時段</th><th>TC</th><th>自有</th><th>第三方</th><th>等效每小時 TC</th><th>建議 Rider</th><th>晚指派%</th><th>晚報到%</th></tr></thead><tbody id="demandBody"></tbody></table></div></div>`;function redraw(){let t=+$('tplh').value||2;$('demandBody').innerHTML=labels.map(k=>{let z=m[k],n=z.length;return `<tr><td>${k}</td><td>${n}</td><td>${z.filter(x=>x.type==='own').length}</td><td>${z.filter(x=>x.type==='third').length}</td><td>${n*4}</td><td>${Math.ceil(n*4/t)}</td><td>${fmt(pct(z.filter(x=>x.lateAssign).length,validCount(z,'assignLead')))}%</td><td>${fmt(pct(z.filter(x=>x.lateArrive).length,validCount(z,'arriveLead')))}%</td></tr>`}).join('')}$('tplh').oninput=redraw;redraw();chart('demandChart','bar',labels,[{label:'自有',data:labels.map(k=>m[k].filter(x=>x.type==='own').length),stack:'x'},{label:'第三方',data:labels.map(k=>m[k].filter(x=>x.type==='third').length),stack:'x'}])}
function renderOpportunities(){let stores=Object.entries(groupBy(data,'store')).map(([s,z])=>({s,n:z.length,la:z.filter(x=>x.lateAssign).length,lr:z.filter(x=>x.lateArrive).length,lw:z.filter(x=>x.longWait).length,wait:avg(z,'storeWait')}));let top=(k)=>stores.slice().sort((a,b)=>b[k]-a[k]).slice(0,5);let distBins=[['0–1 km',0,1],['1–2 km',1,2],['2–3 km',2,3],['3–4 km',3,4],['4+ km',4,999]].map(([n,a,b])=>{let z=data.filter(x=>x.distance>=a&&x.distance<b);return{n,tc:z.length,road:avg(z,'road'),d25:pct(z.filter(x=>String(x.d25).toUpperCase()==='Y').length,z.filter(x=>['Y','N'].includes(String(x.d25).toUpperCase())).length)}});$('opportunities').innerHTML=`<div class="grid two"><div class="card section"><h2>晚指派影響量最高</h2>${top('la').map(x=>`<div class="opportunity"><div class="metric-row"><b>${esc(x.s)}</b><strong>${x.la} 筆</strong></div><div class="note">TC ${x.n}</div></div>`).join('')}</div><div class="card section"><h2>店內等待 >10 分影響量最高</h2>${top('lw').map(x=>`<div class="opportunity"><div class="metric-row"><b>${esc(x.s)}</b><strong>${x.lw} 筆</strong></div><div class="note">平均店內等待 ${fmt(x.wait)} 分</div></div>`).join('')}</div></div><div class="card section"><h2>距離 × 配送效率</h2><div class="tablewrap"><table><thead><tr><th>距離</th><th>TC</th><th>平均離店→送達</th><th>D25</th></tr></thead><tbody>${distBins.map(x=>`<tr><td>${x.n}</td><td>${x.tc}</td><td>${fmt(x.road)} 分</td><td>${fmt(x.d25)}%</td></tr>`).join('')}</tbody></table></div></div><div class="card section"><h2>診斷邏輯</h2><p class="note">晚指派高 → 優先檢查人力與派單時機；晚報到高但指派不晚 → 檢查 Rider 到店效率；報到後等待高 → 檢查餐廳出餐/交付；離店後配送時間隨距離急升 → 檢查 RDE 範圍與第三方轉派策略。此頁以「受影響筆數」優先，避免只看小樣本高比例。</p></div>`}
function renderAll(){destroyCharts();renderOverview();renderStores();renderOrders();renderRiders();renderDemand();renderOpportunities()}
$('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=ev=>{let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});let ws=wb.Sheets['ByOrder']||wb.Sheets[wb.SheetNames[0]];raw=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true}).map(normalize).filter(x=>x.orderId);$('welcome').style.display='none';$('filters').style.display='flex';fillSelect('rcFilter',unique('rc'));fillSelect('acFilter',unique('ac'));fillSelect('storeFilter',unique('store'));apply()};reader.readAsArrayBuffer(f)});
['typeFilter','rcFilter','acFilter','storeFilter','dateFilter'].forEach(id=>$(id).addEventListener('change',apply));$('clearFilter').onclick=()=>{['typeFilter','rcFilter','acFilter','storeFilter'].forEach(id=>$(id).value='all');$('dateFilter').value='';apply()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});$('demoInfo').onclick=()=>$('file').click();
</script></body></html>
